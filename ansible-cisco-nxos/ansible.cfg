[defaults]
# Output format - YAML for structured output where supported
stdout_callback = yaml
bin_ansible_callbacks = True

# Inventory path (relative to project root)
inventory = inventories/lab/hosts.yml

# Disable host key checking for lab environment only
# WARNING: Do not disable in production without proper security controls
host_key_checking = False

# Disable retry files to prevent clutter
retry_files_enabled = False

# Persistent connection settings for network_cli
persistent_command_timeout = 60
persistent_connect_timeout = 30
persistent_network_cli_retries = 3

# Minimize interpreter warnings for network devices
interpreter_python = auto_silent

# Display settings
display_skipped_hosts = True
nocolor = False

# Logging
log_path = ansible.log

[privilege_escalation]
become = False

[connection]
# SSH settings for network_cli
pipelining = False

[inventory]
# Enable YAML inventory parser
enable_plugins = host_list, script, auto, yaml, ini
